<!-- @dsCard group="Colors" viewport="700x150" name="Status — go / warn / stop / info" subtitle="Job states, validation, availability. Soft tint + 700 text." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--surface-card)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-caption);font-size:10.5px}.n{font:var(--type-caption);font-size:10.5px;color:var(--text-muted)}.grid{display:grid;gap:10px}.rowc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mono{font:var(--type-mono)}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div>
<div style="display:flex"><div class="sw" style="background:var(--go-100)">100</div><div class="sw" style="background:var(--go-500);color:#fff">500</div><div class="sw" style="background:var(--go-700);color:#fff">700</div></div>
<div class="n" style="margin-top:5px">Disponible / finalizado</div></div><div>
<div style="display:flex"><div class="sw" style="background:var(--warn-100)">100</div><div class="sw" style="background:var(--warn-500);color:#fff">500</div><div class="sw" style="background:var(--warn-700);color:#fff">700</div></div>
<div class="n" style="margin-top:5px">Urgente / pendiente</div></div><div>
<div style="display:flex"><div class="sw" style="background:var(--stop-100)">100</div><div class="sw" style="background:var(--stop-500);color:#fff">500</div><div class="sw" style="background:var(--stop-700);color:#fff">700</div></div>
<div class="n" style="margin-top:5px">Cancelado / error</div></div><div>
<div style="display:flex"><div class="sw" style="background:var(--sky-100)">100</div><div class="sw" style="background:var(--sky-500);color:#fff">500</div><div class="sw" style="background:var(--sky-700);color:#fff">700</div></div>
<div class="n" style="margin-top:5px">En curso / informativo</div></div>
</div></body></html>
