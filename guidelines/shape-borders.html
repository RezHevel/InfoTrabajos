<!-- @dsCard group="Shape" viewport="700x160" name="Borders, rules & focus" subtitle="1px borders, hairline dividers, 3px active bar, clay focus ring" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--surface-card)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-caption);font-size:10.5px}.n{font:var(--type-caption);font-size:10.5px;color:var(--text-muted)}.grid{display:grid;gap:10px}.rowc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mono{font:var(--type-mono)}</style></head><body><div class="rowc" style="gap:16px">
<div style="width:150px;height:44px;border:1px solid var(--border-default);border-radius:var(--radius-2);display:flex;align-items:center;justify-content:center;font:var(--type-caption)">border-default</div>
<div style="width:150px;height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-2);display:flex;align-items:center;justify-content:center;font:var(--type-caption)">border-strong</div>
<div style="width:150px;height:44px;border:1px solid var(--border-focus);box-shadow:var(--focus-ring);border-radius:var(--radius-2);display:flex;align-items:center;justify-content:center;font:var(--type-caption)">focus-ring</div>
<div style="width:120px;border-bottom:var(--bar-w) solid var(--brand);padding-bottom:8px;font:var(--type-label)">bar-w 3px</div>
</div>
<hr>
<div class="n">hr / list dividers: 1px --border-hairline</div></body></html>
