<!-- @dsCard group="Colors" viewport="700x240" name="Temas claro y oscuro" subtitle="data-theme=&quot;light|dark&quot; en cualquier contenedor reescribe todos los alias semánticos" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--surface-card);display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{background:var(--surface-page);border:1px solid var(--border-default);border-radius:var(--radius-3);padding:14px;display:flex;flex-direction:column;gap:10px}.c{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-3);padding:12px;box-shadow:var(--shadow-1)}.t{font:var(--type-h4);color:var(--text-strong)}.m{font:var(--type-caption);color:var(--text-muted);margin-top:3px}.b{height:40px;border-radius:var(--radius-2);background:var(--brand);color:var(--text-on-brand);font:var(--type-button);display:flex;align-items:center;justify-content:center}.tag{display:inline-flex;font:var(--type-label);padding:3px 8px;border-radius:var(--radius-1);background:var(--state-go-soft);color:var(--go-700)}.eb{font:var(--type-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--text-subtle)}</style></head><body>
<div class="pane" data-theme="light"><div class="eb">data-theme="light"</div><div class="c"><div class="t">Marta Quiñones</div><div class="m">Electricista · Chapalita · 2.4 km</div><span class="tag" style="margin-top:8px">Disponible</span></div><div class="b">Contactar</div></div>
<div class="pane" data-theme="dark"><div class="eb">data-theme="dark"</div><div class="c"><div class="t">Marta Quiñones</div><div class="m">Electricista · Chapalita · 2.4 km</div><span class="tag" style="margin-top:8px">Disponible</span></div><div class="b">Contactar</div></div>
</body></html>
