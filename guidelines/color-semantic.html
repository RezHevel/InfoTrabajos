<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="Use these in components, not the raw ramps" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--surface-card)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-caption);font-size:10.5px}.n{font:var(--type-caption);font-size:10.5px;color:var(--text-muted)}.grid{display:grid;gap:10px}.rowc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mono{font:var(--type-mono)}</style></head><body><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;font:var(--type-caption)">
<div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--surface-page)"></span><span class="mono" style="font-size:11.5px">--surface-page</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--surface-card)"></span><span class="mono" style="font-size:11.5px">--surface-card</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--surface-sunken)"></span><span class="mono" style="font-size:11.5px">--surface-sunken</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--surface-inverse)"></span><span class="mono" style="font-size:11.5px">--surface-inverse</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--brand)"></span><span class="mono" style="font-size:11.5px">--brand</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--accent)"></span><span class="mono" style="font-size:11.5px">--accent</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--text-strong)"></span><span class="mono" style="font-size:11.5px">--text-strong</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--text-body)"></span><span class="mono" style="font-size:11.5px">--text-body</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--text-muted)"></span><span class="mono" style="font-size:11.5px">--text-muted</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--border-hairline)"></span><span class="mono" style="font-size:11.5px">--border-hairline</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--border-default)"></span><span class="mono" style="font-size:11.5px">--border-default</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;border-radius:var(--radius-1);border:1px solid var(--border-default);background:var(--border-strong)"></span><span class="mono" style="font-size:11.5px">--border-strong</span></div>
</div></body></html>
